name: frontend
description: "Job Recruitment Management System (JRMS) - Modern Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  file_picker: ^8.0.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
